<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>我的电视台</title>
<style>
:root{--bg:#0f1115;--panel:#171b22;--line:#262c36;--txt:#e8eaed;--dim:#9aa3b2;--acc:#1db954;}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
header{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;background:var(--panel)}
header h1{font-size:17px;font-weight:700;white-space:nowrap}
header h1 span{color:var(--acc)}
#search{flex:1;max-width:280px;background:#0c0e12;border:1px solid var(--line);color:var(--txt);border-radius:20px;padding:7px 14px;font-size:14px;outline:none}
#search:focus{border-color:var(--acc)}
#count{font-size:12px;color:var(--dim);white-space:nowrap}
main{flex:1;display:flex;min-height:0}
#side{width:230px;min-width:230px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:8px}
#side h3{font-size:12px;color:var(--dim);padding:10px 8px 4px;font-weight:600}
.ch{display:block;width:100%;text-align:left;background:none;border:none;color:var(--txt);padding:9px 10px;border-radius:8px;font-size:14px;cursor:pointer}
.ch:hover{background:#20262f}
.ch.on{background:#1d2b22;color:var(--acc);font-weight:700}
#stage{flex:1;display:flex;flex-direction:column;min-width:0;background:#000}
#meta{padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px}
#meta b{font-size:16px}
#meta span{color:var(--dim);font-size:12px;margin-left:8px}
#wrap{flex:1;position:relative;min-height:0}
video{width:100%;height:100%;background:#000}
#msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:14px;text-align:center;padding:20px;pointer-events:none}
.spin{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:720px){
  #side{position:fixed;left:0;top:0;bottom:0;z-index:10;transform:translateX(-100%);transition:.25s;box-shadow:4px 0 20px rgba(0,0,0,.5)}
  body.open #side{transform:none}
  #menuBtn{display:inline-block!important}
}
#menuBtn{display:none;background:none;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:6px 10px;font-size:14px}
</style>
</head>
<body>
<header>
  <button id="menuBtn">☰ 频道</button>
  <h1>📺 我的<span>电视台</span></h1>
  <input id="search" placeholder="搜索频道…">
  <span id="count"></span>
</header>
<main>
  <nav id="side"></nav>
  <section id="stage">
    <div id="meta"><b id="chName">请选择频道</b><span id="chInfo"></span></div>
    <div id="wrap">
      <video id="v" controls playsinline></video>
      <div id="msg"><div>👈 从左侧选一个频道开始看</div></div>
    </div>
  </section>
</main>
<script src="channels.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const v=document.getElementById('v'),msg=document.getElementById('msg'),
      side=document.getElementById('side'),search=document.getElementById('search'),
      chName=document.getElementById('chName'),chInfo=document.getElementById('chInfo'),
      count=document.getElementById('count');
let hls=null,cur=-1,retry=0;
const channels=CHANNELS;
function show(html){msg.style.display='flex';msg.innerHTML=html;}
function hide(){msg.style.display='none';}
function loading(t){show('<div><div class="spin"></div>'+t+'</div>');}
function bust(u){return u+(u.includes('?')?'&':'?')+'t='+Date.now();}
function init(){
  count.textContent=channels.length+' 路';
  chInfo.textContent='港台 / 日韩 / 欧美直链 '+channels.length+' 路，打开即看';
  render('');
  const last=parseInt(localStorage.getItem('mytv_pub_last')||'-1',10);
  if(last>=0&&channels[last])play(last);
}
function render(q){
  q=q.trim().toLowerCase();side.innerHTML='';let n=0,lastG='';
  channels.forEach((c,idx)=>{
    if(q&&!(c.name.toLowerCase().includes(q)||c.group.includes(q)))return;
    n++;
    if(c.group!==lastG){lastG=c.group;const h=document.createElement('h3');h.textContent=c.group;side.appendChild(h);}
    const b=document.createElement('button');
    b.className='ch'+(cur===idx?' on':'');b.textContent=c.name;
    b.onclick=()=>{play(idx);document.body.classList.remove('open');};
    side.appendChild(b);
  });
  if(!n)side.innerHTML='<h3>无匹配频道</h3>';
}
search.oninput=()=>render(search.value);
document.getElementById('menuBtn').onclick=()=>document.body.classList.toggle('open');
function play(idx){
  cur=idx;retry=0;localStorage.setItem('mytv_pub_last',String(idx));
  render(search.value);
  const c=channels[idx],url=c.play;
  chName.textContent='▶ '+c.name;chInfo.textContent=c.group+' · 正在连接…';
  loading('正在加载 '+c.name+'…');
  if(hls){hls.destroy();hls=null;}
  v.onerror=null;v.onplaying=null;
  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;
    v.play().catch(()=>{});
    v.onplaying=()=>{hide();chInfo.textContent=c.group+' · 直播中';};
    v.onerror=()=>{if(retry<3){retry++;setTimeout(()=>{v.src=bust(url);v.play().catch(()=>{});},2000);}
      else show('❌ 播放失败：该源可能在你网络下不可用，换个频道试试');};
  }else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30,liveSyncDurationCount:3});
    hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{hide();chInfo.textContent=c.group+' · 直播中';v.play().catch(()=>{});});
    hls.on(Hls.Events.ERROR,(ev,data)=>{
      if(data.fatal&&retry<3){retry++;loading('信号中断，正在重连…('+retry+'/3)');
        setTimeout(()=>hls.loadSource(bust(url)),2500);}
      else if(data.fatal){show('❌ 播放失败：该源可能在你网络下不可用，换个频道试试');}
    });
  }else{show('❌ 当前浏览器不支持 HLS 播放');}
}
v.addEventListener('playing',hide);
init();
</script>
</body>
</html>
