<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>我的电视台</title>
<style>
:root{
  --bg:#0b0d10; --card:#161a20; --card2:#1d232c; --line:#262d38;
  --txt:#f0f2f5; --dim:#9aa4b2; --acc:#1db954; --acc-d:#128a3e;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;overflow:hidden;
  padding-top:env(safe-area-inset-top);
}
/* ---- 顶栏 ---- */
header{
  display:flex;align-items:center;gap:10px;
  padding:12px 16px 10px;flex:none;
}
header h1{font-size:19px;font-weight:800;letter-spacing:.5px;flex:1}
header h1 span{color:var(--acc)}
#gearBtn{
  background:var(--card);border:1px solid var(--line);color:var(--dim);
  width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;flex:none;
}
#gearBtn:active{transform:scale(.94)}
/* ---- 播放器（置顶） ---- */
#player{flex:none;padding:0 12px;width:100%;}
@media(min-width:900px){
  #player{max-width:860px;margin:0 auto;}
  #searchRow{max-width:860px;margin:0 auto;width:100%;}
  #chips{max-width:860px;margin:0 auto;width:100%;}
  #count{max-width:860px;margin:0 auto;width:100%;}
  #sheet{align-items:center;}
  #panel{border-radius:20px;}
}
#vwrap{
  position:relative;width:100%;aspect-ratio:16/9;background:#000;
  border-radius:var(--r);overflow:hidden;
}
video{width:100%;height:100%;background:#000;display:block}
#msg{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dim);font-size:14px;text-align:center;padding:20px;pointer-events:none;background:rgba(0,0,0,.45);
}
.spin{width:36px;height:36px;border:3px solid var(--line);border-top-color:var(--acc);
  border-radius:50%;animation:sp 1s linear infinite;margin:0 auto 12px}
@keyframes sp{to{transform:rotate(360deg)}}
#retryBtn{
  pointer-events:auto;margin-top:12px;background:var(--acc);color:#04140a;border:none;
  border-radius:20px;padding:10px 26px;font-size:15px;font-weight:700;cursor:pointer;
}
#nowbar{display:flex;align-items:center;gap:8px;padding:10px 4px 2px;min-height:40px}
#liveDot{width:9px;height:9px;border-radius:50%;background:#3a414c;flex:none}
#liveDot.on{background:#ff3b30;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#chName{font-size:16px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#chGroup{font-size:12px;color:var(--dim);background:var(--card);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;white-space:nowrap}
/* ---- 搜索 ---- */
#searchRow{flex:none;padding:8px 12px 4px}
#search{
  width:100%;background:var(--card);border:1px solid var(--line);color:var(--txt);
  border-radius:24px;padding:12px 18px;font-size:15px;outline:none;
}
#search:focus{border-color:var(--acc)}
/* ---- 分组 chips ---- */
#chips{
  flex:none;display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;
  scrollbar-width:none;
}
#chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--card);border:1px solid var(--line);color:var(--dim);
  border-radius:20px;padding:9px 16px;font-size:14px;cursor:pointer;white-space:nowrap;
}
.chip.on{background:var(--acc);border-color:var(--acc);color:#04140a;font-weight:700}
.chip .n{opacity:.75;font-size:12px;margin-left:4px}
/* ---- 频道宫格 ---- */
#grid{
  flex:1;overflow-y:auto;padding:8px 12px calc(20px + env(safe-area-inset-bottom));
  display:grid;grid-template-columns:repeat(2,1fr);gap:10px;align-content:start;
}
@media(min-width:560px){#grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:900px){#grid{grid-template-columns:repeat(4,1fr);max-width:1100px;margin:0 auto;width:100%}}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px 10px;cursor:pointer;text-align:center;min-height:76px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s;
}
.card:active{transform:scale(.96)}
.card .t{font-size:15px;font-weight:600;line-height:1.3;word-break:break-word}
.card .g{font-size:11px;color:var(--dim)}
.card.on{border-color:var(--acc);background:#12291a}
.card.on .t{color:var(--acc)}
#empty{grid-column:1/-1;text-align:center;color:var(--dim);padding:40px 0;font-size:14px}
#count{flex:none;text-align:center;font-size:11px;color:var(--dim);padding:2px 0 6px}
/* ---- 设置弹窗 ---- */
#sheet{
  position:fixed;inset:0;z-index:50;display:none;
  background:rgba(0,0,0,.6);align-items:flex-end;justify-content:center;
}
#sheet.open{display:flex}
#panel{
  width:100%;max-width:560px;background:var(--card2);border-radius:20px 20px 0 0;
  padding:20px 18px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
}
#panel h2{font-size:17px;margin-bottom:6px}
#panel p{font-size:13px;color:var(--dim);margin-bottom:12px;line-height:1.5}
#panel input{
  width:100%;background:#0c0e12;border:1px solid var(--line);color:var(--txt);
  border-radius:10px;padding:12px;font-size:14px;outline:none;margin-bottom:10px;
}
#panel .row{display:flex;gap:10px}
.btn{flex:1;border:none;border-radius:12px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
.btn.go{background:var(--acc);color:#04140a}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--dim);flex:.6}
#wstat{font-size:12px;color:var(--dim);margin-top:10px;min-height:18px}
</style>
</head>
<body>
<header>
  <h1>📺 我的<span>电视台</span></h1>
  <button id="gearBtn" title="设置">⚙️</button>
</header>

<div id="player">
  <div id="vwrap">
    <video id="v" controls playsinline></video>
    <div id="msg"><div>👆 选一个频道开始看</div></div>
  </div>
  <div id="nowbar">
    <span id="liveDot"></span>
    <span id="chName">还没选频道</span>
    <span id="chGroup" style="display:none"></span>
  </div>
</div>

<div id="searchRow"><input id="search" placeholder="🔍 搜索频道…" autocomplete="off"></div>
<div id="chips"></div>
<div id="count"></div>
<div id="grid"></div>

<div id="sheet">
  <div id="panel">
    <h2>⚙️ 设置</h2>
    <p>Worker 后端地址（看央视 / 看看新闻 / 马来西亚台用）。一般不用改。</p>
    <input id="wurl" placeholder="https://xxx.workers.dev" autocomplete="off">
    <div class="row">
      <button class="btn go" id="wsave">保存</button>
      <button class="btn ghost" id="wclose">关闭</button>
    </div>
    <div id="wstat"></div>
  </div>
</div>

<script src="channels.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const v=document.getElementById('v'),msg=document.getElementById('msg'),
      grid=document.getElementById('grid'),chips=document.getElementById('chips'),
      search=document.getElementById('search'),chName=document.getElementById('chName'),
      chGroup=document.getElementById('chGroup'),liveDot=document.getElementById('liveDot'),
      count=document.getElementById('count');
let hls=null,cur=-1,retry=0,curGroup='全部';
const channels=CHANNELS.slice();
const groups=()=>['全部',...new Set(channels.map(c=>c.group))];

function show(html){msg.style.display='flex';msg.innerHTML=html;}
function hide(){msg.style.display='none';}
function loading(t){show('<div><div class="spin"></div>'+t+'</div>');}
function bust(u){return u+(u.includes('?')?'&':'?')+'t='+Date.now();}
function workerBase(){return (localStorage.getItem('mytv_worker')||'https://tv-player.qingtian6325.workers.dev').replace(/\/+$/,'');}

async function loadWorkerChannels(){
  const base=workerBase(),stat=document.getElementById('wstat');
  stat.textContent='正在连接 Worker…';
  try{
    const r=await fetch(base+'/api/channels');
    if(!r.ok)throw new Error('http '+r.status);
    const j=await r.json();
    let n=0;
    for(const c of j.channels||[]){channels.push({name:c.name,group:c.group,play:base+c.play});n++;}
    stat.textContent='✅ 已加载 '+n+' 路';
    renderAll();
  }catch(e){stat.textContent='❌ Worker 连接失败：'+e.message;}
}

function renderChips(){
  const gs=groups(),q=search.value.trim().toLowerCase();
  chips.innerHTML='';
  gs.forEach(g=>{
    const list=channels.filter(c=>c.group===g||g==='全部')
      .filter(c=>!q||c.name.toLowerCase().includes(q));
    if(g!=='全部'&&!list.length)return;
    const b=document.createElement('button');
    b.className='chip'+(curGroup===g?' on':'');
    b.innerHTML=g+' <span class="n">'+list.length+'</span>';
    b.onclick=()=>{curGroup=g;renderChips();renderGrid();};
    chips.appendChild(b);
  });
}
function renderGrid(){
  const q=search.value.trim().toLowerCase();
  const list=channels.map((c,i)=>({...c,idx:i}))
    .filter(c=>(curGroup==='全部'||c.group===curGroup))
    .filter(c=>!q||c.name.toLowerCase().includes(q)||c.group.includes(q));
  grid.innerHTML='';
  count.textContent=list.length+' 个频道';
  if(!list.length){grid.innerHTML='<div id="empty">没找到，换个关键词试试</div>';return;}
  list.forEach(c=>{
    const d=document.createElement('div');
    d.className='card'+(cur===c.idx?' on':'');
    d.innerHTML='<div class="t">'+escapeHtml(c.name)+'</div><div class="g">'+escapeHtml(c.group)+'</div>';
    d.onclick=()=>play(c.idx);
    grid.appendChild(d);
  });
}
function escapeHtml(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function renderAll(){renderChips();renderGrid();}

search.oninput=()=>{renderChips();renderGrid();};

function setPlayingUI(c,ok){
  chName.textContent=(ok?'▶ ':'')+c.name;
  chGroup.style.display='';chGroup.textContent=c.group;
  liveDot.classList.toggle('on',!!ok);
}
function play(idx){
  cur=idx;retry=0;
  try{localStorage.setItem('mytv_pub_last',String(idx));}catch(e){}
  renderGrid();
  const c=channels[idx],url=c.play;
  setPlayingUI(c,false);
  loading('正在加载 '+c.name+'…');
  document.getElementById('player').scrollIntoView({behavior:'smooth',block:'nearest'});
  if(hls){hls.destroy();hls=null;}
  const fail=()=>{
    if(retry<3){retry++;loading('信号中断，重连中…('+retry+'/3)');
      setTimeout(()=>play(idx),2500);}
    else{setPlayingUI(c,false);
      show('<div>❌ 播不了<div style="font-size:12px;margin-top:6px">这个源在你网络下不可用</div><button id="retryBtn">换个频道试试</button></div>');
      document.getElementById('retryBtn').onclick=()=>{hide();setPlayingUI({name:'还没选频道'},false);chGroup.style.display='none';liveDot.classList.remove('on');chName.textContent='还没选频道';};
    }
  };
  if(v.canPlayType('application/vnd.apple.mpegurl')){
    v.src=url;v.play().catch(()=>{});
    v.onplaying=()=>{hide();setPlayingUI(c,true);};
    v.onerror=fail;
  }else if(window.Hls&&Hls.isSupported()){
    hls=new Hls({maxBufferLength:30,liveSyncDurationCount:3});
    hls.loadSource(url);hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED,()=>{hide();setPlayingUI(c,true);v.play().catch(()=>{});});
    hls.on(Hls.Events.ERROR,(ev,data)=>{if(data.fatal)fail();});
  }else{show('❌ 当前浏览器不支持 HLS 播放');}
}
v.addEventListener('playing',hide);

/* 设置弹窗 */
const sheet=document.getElementById('sheet'),wurl=document.getElementById('wurl');
document.getElementById('gearBtn').onclick=()=>{
  wurl.value=localStorage.getItem('mytv_worker')||'';
  document.getElementById('wstat').textContent='';
  sheet.classList.add('open');
};
document.getElementById('wclose').onclick=()=>sheet.classList.remove('open');
sheet.onclick=e=>{if(e.target===sheet)sheet.classList.remove('open');};
document.getElementById('wsave').onclick=()=>{
  const val=wurl.value.trim().replace(/\/+$/,'');
  if(val)localStorage.setItem('mytv_worker',val);else localStorage.removeItem('mytv_worker');
  location.reload();
};

renderAll();
loadWorkerChannels();
const last=parseInt(localStorage.getItem('mytv_pub_last')||'-1',10);
if(last>=0&&channels[last])play(last);
</script>
</body>
</html>
